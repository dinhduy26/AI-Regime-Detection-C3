# Giao diện dashboard (streamlit run dashboard/app.py từ thư mục gốc dự án sẽ đọc file này)
[theme]
base = "light"
primaryColor = "#36584A"
backgroundColor = "#E7E1D8"
secondaryBackgroundColor = "#F3EEE6"
textColor = "#2E2A24"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
